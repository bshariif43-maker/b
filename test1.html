<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Registration form</title>
    <link rel="stylesheet" href="ovv.css">
  
  </head>
  <body>
    <fieldset>
    <h1 >Student Registration form</h1>
      <form action="">
        <p>
          <label for="Student Name:">Student Name:</label>
          <input
            type="text"
            name="Student Name:"
            id="Student Name:"
            required
            placeholder="Student name"
          /><br />
        </p>
        <p>
          <label for="Father`s Name:">Father`s Name:</label>
          <input
            type="text"
            name="Father`s Name:"
            id="Father`s Name:"
            required
            placeholder="Enter your father name"
          />
        </p>

        <p>
          <label for="Date of birth:">Date of birth:</label>
          <input
            type="date"
            name="Date of birth:"
            id="Date of birth:"
            required
            placeholder="Enter date of birth"
          />
        </p>

        <p>
          <label for="Mobel No:">Mobel No:</label>
          <input
            type="tel"
            name="Mobel No:"
            id="Mobel No:"
            required
            placeholder="mobile number"
          />
        </p>
        <p>
          <label for="Email id:">Email id:</label>
          <input
            type="email"
            name="Email id:"
            id="Email id:"
            required
            placeholder="Enter your email"
          />
        </p>
        <p>
          <label for="Password:">Password:</label>
          <input
            type="password"
            name="Password:"
            id="Password:"
            placeholder="Enter your password"
            maxlength="10"
            minlength="8"
          />
        </p>
        <p>
          <label for="Gender:">Gender:</label>
          <input type="radio" name="gender" id="male " value="male" />
          <label for="Male:">Male:</label>
          <input type="radio" name="gender" id="female " value="female" />
          <label for="Female:">Female:</label>
        </p>

        <p>
          <label for="Department:">Department:</label>
          <input type="checkbox" id="CSE" name="CSE" />
          <label>CSE</label>
          <input type="checkbox" id="IT" name="IT" />
          <label>IT</label>
          <input type="checkbox" id="ENG" name="ENG" />
          <label>ENG</label>
          <input type="checkbox" id="ECE" name="ECE" />
          <label>ECE</label>
        </p>
        <p>
          <label for="Course:">Course:</label>
          <select>
            <option value="" disabled selected>
              ---Select Current Course`s
            </option>
            <option value="">HTML</option>
            <option value="">PYTHON</option>
            <option value="">JAVA</option>
            <option value="">CONFLICT</option>
            <option value="">MATH</option>
          </select>
        </p>
        <p>
<label for="Student Photo:">Student Photo:</label>
<input type="file" name="Student Photo:" id="Student Photo:" required>
 </p>
 <p>
<label for="City:">City:</label>
<input type="text" name="City:" id="City:" required placeholder="Enter your city">


 </p>
 <p>
    <label for="Address:">Address:</label><br>
    <textarea name="Address:" id="Address:" aria-setsize="10px"></textarea>
 </p>
 <p>
   <button>Register</button> 
 </p>
      </form>
    </fieldset>
  </body>
</html>
